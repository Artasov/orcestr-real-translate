name: CI / Release

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ startsWith(github.ref, 'refs/tags/v') && format('orcestr-real-translate-release-{0}', github.ref_name) || format('orcestr-real-translate-ci-{0}', github.ref) }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

env:
  NODE_VERSION: 24.18.0
  RUST_VERSION: 1.97.0
  AUTH_SDK_SHA: 8a098154e49dc5be724bb349a2aa224cceb82376
  AWS_DEFAULT_REGION: ${{ vars.S3_REGION }}

jobs:
  dependency-preflight:
    name: Validate pinned dependencies
    runs-on: ubuntu-latest
    outputs:
      auth-sdk-sha: ${{ steps.auth-sdk.outputs.sha }}
    steps:
      - name: Validate immutable auth SDK revision
        id: auth-sdk
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$AUTH_SDK_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Workflow-pinned AUTH_SDK_SHA must be a full 40-character commit SHA." >&2
            exit 1
          fi
          printf 'sha=%s\n' "$AUTH_SDK_SHA" >> "$GITHUB_OUTPUT"

  release-preflight:
    name: Validate release provenance
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Fetch tagged commit, origin/main, and tags
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Require the tagged commit to be contained in origin/main
        run: node scripts/verify-release-provenance.mjs "$GITHUB_REF" refs/remotes/origin/main "$GITHUB_SHA"

      - name: Validate release configuration
        shell: bash
        env:
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_ENDPOINT_URL: ${{ vars.S3_ENDPOINT_URL }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_PUBLIC_BASE_URL: ${{ vars.S3_PUBLIC_BASE_URL }}
          S3_REGION: ${{ vars.S3_REGION }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for name in \
            S3_ACCESS_KEY_ID \
            S3_SECRET_ACCESS_KEY \
            S3_ENDPOINT_URL \
            S3_BUCKET \
            S3_PUBLIC_BASE_URL \
            S3_REGION \
            TAURI_SIGNING_PRIVATE_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing GitHub release configuration: ${name}" >&2
              exit 1
            fi
          done
          [[ "$S3_ENDPOINT_URL" == https://* ]] || { echo "S3_ENDPOINT_URL must use HTTPS" >&2; exit 1; }
          [[ "$S3_PUBLIC_BASE_URL" == https://* ]] || { echo "S3_PUBLIC_BASE_URL must use HTTPS" >&2; exit 1; }

  quality:
    name: Targeted checks
    needs: dependency-preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: orcestr-real-translate
          persist-credentials: false

      - name: Checkout auth SDK
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Artasov/orcestr-auth
          ref: ${{ needs.dependency-preflight.outputs.auth-sdk-sha }}
          path: orcestr-auth
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            orcestr-auth/frontend/package-lock.json
            orcestr-real-translate/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-21
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libpulse-dev

      - name: Build auth SDK dependencies
        working-directory: orcestr-auth/frontend
        run: |
          npm ci
          npm run build --workspace @orcestr/auth-core --workspace @orcestr/auth-react --workspace @orcestr/auth-forms

      - name: Install app dependencies
        working-directory: orcestr-real-translate
        run: npm ci

      - name: Typecheck renderer
        working-directory: orcestr-real-translate
        run: npm run typecheck

      - name: Verify synchronized versions
        working-directory: orcestr-real-translate
        run: npm run version:check

      - name: Test renderer
        working-directory: orcestr-real-translate
        run: npm test

      - name: Test release tooling
        working-directory: orcestr-real-translate
        run: npm run test:tooling

      - name: Build renderer
        working-directory: orcestr-real-translate
        run: npm run build:renderer

      - name: Test Rust core
        working-directory: orcestr-real-translate
        run: npm run test:rust

  native-check:
    name: Check native backend (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-15
            platform: macOS-arm64
          - os: macos-15-intel
            platform: macOS-x64
    steps:
      - name: Checkout app
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-21
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Compile native backend
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked

  package:
    name: Package ${{ matrix.platform }}
    needs: [dependency-preflight, quality, native-check, release-preflight]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            bundles: nsis,msi
            target_args: ""
            bundle_root: src-tauri/target/release/bundle
            release_architecture: native
          - os: macos-15
            platform: darwin
            bundles: app,dmg
            target_args: --target universal-apple-darwin
            bundle_root: src-tauri/target/universal-apple-darwin/release/bundle
            release_architecture: universal
          - os: ubuntu-latest
            platform: linux
            bundles: appimage,deb
            target_args: ""
            bundle_root: src-tauri/target/release/bundle
            release_architecture: native

    steps:
      - name: Checkout app
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: orcestr-real-translate
          persist-credentials: false

      - name: Checkout auth SDK
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Artasov/orcestr-auth
          ref: ${{ needs.dependency-preflight.outputs.auth-sdk-sha }}
          path: orcestr-auth
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            orcestr-auth/frontend/package-lock.json
            orcestr-real-translate/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-21
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libpulse-dev

      - name: Install universal macOS Rust targets
        if: matrix.platform == 'darwin'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Build auth SDK dependencies
        working-directory: orcestr-auth/frontend
        run: |
          npm ci
          npm run build --workspace @orcestr/auth-core --workspace @orcestr/auth-react --workspace @orcestr/auth-forms

      - name: Install app dependencies
        working-directory: orcestr-real-translate
        run: npm ci

      - name: Verify release version
        working-directory: orcestr-real-translate
        run: node scripts/verify-release-version.mjs "${{ github.ref_name }}"

      - name: Build Tauri bundles
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: orcestr-real-translate
          tauriScript: npm run tauri
          args: --verbose ${{ matrix.target_args }} --bundles ${{ matrix.bundles }}

      - name: Collect distributable bundles
        working-directory: orcestr-real-translate
        env:
          RELEASE_ARCHITECTURE: ${{ matrix.release_architecture }}
        run: node scripts/collect-bundles.mjs "${{ matrix.bundle_root }}" release-package "${{ matrix.platform }}"

      - name: Upload platform package directly to immutable S3
        working-directory: orcestr-real-translate
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_ENDPOINT_URL: ${{ vars.S3_ENDPOINT_URL }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
        run: node scripts/upload-immutable-directory.mjs release-package "orcestr-real-translate/${{ github.ref_name }}"

  publish:
    name: Publish immutable S3 release
    needs: package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout app
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: orcestr-real-translate
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download every platform bundle from S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_ENDPOINT_URL: ${{ vars.S3_ENDPOINT_URL }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
        run: |
          aws s3 cp \
            "s3://${S3_BUCKET}/orcestr-real-translate/${GITHUB_REF_NAME}/" \
            release-artifacts/ \
            --recursive \
            --endpoint-url "$S3_ENDPOINT_URL"

      - name: Verify release version
        working-directory: orcestr-real-translate
        run: node scripts/verify-release-version.mjs "${{ github.ref_name }}"

      - name: Resolve deterministic release timestamp
        id: release-time
        shell: bash
        run: |
          set -euo pipefail
          source_date_epoch="$(git -C orcestr-real-translate show -s --format=%ct "${GITHUB_SHA}^{commit}")"
          if [[ ! "$source_date_epoch" =~ ^[0-9]+$ ]]; then
            echo "Tagged commit did not provide a valid Unix timestamp." >&2
            exit 1
          fi
          printf 'source-date-epoch=%s\n' "$source_date_epoch" >> "$GITHUB_OUTPUT"

      - name: Build updater and website release manifests
        working-directory: orcestr-real-translate
        env:
          S3_PUBLIC_BASE_URL: ${{ vars.S3_PUBLIC_BASE_URL }}
          SOURCE_DATE_EPOCH: ${{ steps.release-time.outputs.source-date-epoch }}
        run: |
          mkdir -p ../release-manifests
          node scripts/build-release-manifest.mjs \
            ../release-artifacts "${{ github.ref_name }}" "$S3_PUBLIC_BASE_URL" \
            ../release-manifests/manifest.json ../latest.json
          node scripts/build-download-manifest.mjs \
            ../release-artifacts "${{ github.ref_name }}" "$S3_PUBLIC_BASE_URL" \
            ../release-manifests/downloads.json ../downloads.json

      - name: Upload immutable version manifests
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_ENDPOINT_URL: ${{ vars.S3_ENDPOINT_URL }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
        run: |
          node orcestr-real-translate/scripts/upload-immutable-directory.mjs \
            release-manifests "orcestr-real-translate/${GITHUB_REF_NAME}"

      - name: Build GitHub release notes with S3 download links
        env:
          GH_TOKEN: ${{ github.token }}
          S3_PUBLIC_BASE_URL: ${{ vars.S3_PUBLIC_BASE_URL }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f "tag_name=${GITHUB_REF_NAME}" \
            -f "target_commitish=${GITHUB_SHA}" \
            --jq '.body // ""' > generated-notes.md
          node orcestr-real-translate/scripts/build-github-release-notes.mjs \
            release-artifacts "$GITHUB_REF_NAME" "$S3_PUBLIC_BASE_URL" \
            generated-notes.md release-notes.md

      - name: Create GitHub release without GitHub-hosted assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            while IFS= read -r asset; do
              [[ -z "$asset" ]] || gh release delete-asset "$GITHUB_REF_NAME" "$asset" \
                --repo "$GITHUB_REPOSITORY" --yes
            done < <(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --json assets --jq '.assets[].name')
            gh release edit "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Orcestr Real Translate ${GITHUB_REF_NAME}" \
              --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "Orcestr Real Translate ${GITHUB_REF_NAME}" \
              --notes-file release-notes.md
          fi
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" --jq '.assets | length')" = "0"

      - name: Atomically promote public release channels
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_ENDPOINT_URL: ${{ vars.S3_ENDPOINT_URL }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
        run: |
          node orcestr-real-translate/scripts/promote-release-channel.mjs \
            downloads.json orcestr-real-translate/downloads.json
          node orcestr-real-translate/scripts/promote-release-channel.mjs \
            latest.json orcestr-real-translate/latest.json
