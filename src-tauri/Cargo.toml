[package]
name = "orcestr-real-translate"
version = "0.1.0"
description = "Orcestr Real Translate desktop client"
edition = "2021"
license = "MPL-2.0"

[build-dependencies]
cc = "1.2"
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
anyhow = "1.0"
base64 = "0.22"
bytemuck = { version = "1.24", features = ["derive"] }
cpal = "0.17.3"
crossbeam-channel = "0.5"
futures-util = "0.3"
getrandom = "0.3"
keyring = "4.1.6"
nnnoiseless = "0.5.2"
once_cell = "1.21"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-deep-link = "2.4.9"
tauri-plugin-opener = "2.5.4"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-updater = "2.10.1"
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.28", features = ["native-tls"] }
url = "2.5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
] }

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = { version = "8.0.1", features = ["macos_13_0"] }

[target.'cfg(target_os = "linux")'.dependencies]
libpulse-binding = "2.30.1"
libpulse-simple-binding = "2.29.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
